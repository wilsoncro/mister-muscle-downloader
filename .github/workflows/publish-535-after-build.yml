name: Publish verified Windows build
on:
  workflow_run:
    workflows:
      - Build Mister Muscle on Windows
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-mister-muscle-verified
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact source commit and determine version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main_sha="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo 'A newer main commit exists; refusing to release an older build.'
            exit 1
          fi
          gh api "repos/$repo/contents/CHANGELOG.md?ref=$SOURCE_SHA" -H 'Accept: application/vnd.github.raw+json' > changelog.md
          ver="$(sed -nE 's/^## v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' changelog.md | head -1)"
          if [[ -z "$ver" ]]; then echo 'No release version in changelog'; exit 1; fi
          echo "RELEASE_VERSION=$ver" >> "$GITHUB_ENV"
          if gh release view "v$ver" --repo "$repo" >/dev/null 2>&1; then
            echo "Version v$ver already released: refusing to overwrite."
            exit 1
          fi
          awk 'BEGIN{seen=0} /^## v[0-9]+\.[0-9]+\.[0-9]+/{if(seen++)exit} seen{print}' changelog.md > release-notes.md
          if ! grep -q '^- ' release-notes.md; then echo 'Release notes missing'; exit 1; fi
          echo "Verified release v$ver from $SOURCE_SHA."

      - name: Download Windows installer and portable ZIP from passed build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY"             --name "MisterMuscle-v$RELEASE_VERSION-Windows" --dir release-assets
          test -s release-assets/MisterMuscle_Setup.exe
          test -s "release-assets/MisterMuscle_Portable_v$RELEASE_VERSION.zip"
          ls -lh release-assets

      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION"             release-assets/MisterMuscle_Setup.exe             "release-assets/MisterMuscle_Portable_v$RELEASE_VERSION.zip"             --repo "$GITHUB_REPOSITORY"             --target "$SOURCE_SHA"             --title "Mister Muscle Downloader v$RELEASE_VERSION"             --notes-file release-notes.md             --latest
